<style>
    body {
        margin: 0;
        background-color: black;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }

    #wasd-keys {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1000;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 15px;
        border-radius: 10px;
        font-family: Arial, sans-serif;
        font-size: 18px;
        font-weight: bold;
        border: 2px solid #333;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        text-align: center;
    }
    
    #wasd-keys .key {
        display: inline-block;
        background-color: #444;
        color: white;
        padding: 8px 12px;
        margin: 2px;
        border-radius: 5px;
        border: 1px solid #666;
        min-width: 20px;
        text-align: center;
        transition: all 0.1s ease;
    }
    
    #wasd-keys .key.pressed {
        background-color: #666;
        border-color: #888;
        transform: scale(0.95);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }
    
    #wasd-keys .top-row {
        margin-bottom: 10px;
    }
    
    #wasd-keys .bottom-row {
        display: flex;
        justify-content: center;
        gap: 10px;
    }
    
    #death-counter {
        position: fixed;
        top: 20px;
        left: 250px;
        z-index: 1000;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 18px;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    #mute-button {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 1000;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 15px;
        border-radius: 10px;
        font-family: Arial, sans-serif;
        font-size: 20px;
        font-weight: bold;
        border: 2px solid #333;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
        min-width: 60px;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #mute-button:hover {
        background-color: rgba(0, 0, 0, 0.8);
        transform: scale(1.05);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
    }

    #mute-button:active {
        transform: scale(0.95);
    }


</style>

<div id="wasd-keys">
    <div class="top-row"><span class="key" id="key-w">W</span></div>
    <div class="bottom-row">
        <div><span class="key" id="key-a">A</span></div>
        <div><span class="key" id="key-s">S</span></div>
        <div><span class="key" id="key-d">D</span></div>
    </div>
</div>

<div id="death-counter">Deaths: 0</div>

<div id="mute-button" title="Click to mute/unmute">Mute</div>

<canvas></canvas>

<script src="index.js" ></script>
